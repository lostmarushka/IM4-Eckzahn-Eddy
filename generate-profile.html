<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil hinzufügen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cousine:ital,wght@0,400;0,700;1,400;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="page-wrapper">
      <section class="login-wrapper gen-profile-wrapper">

        <!-- Header -->
        <header class="gen-profile-header">
          <a href="choose-profile.html" class="circle-button" aria-label="Zurück">
            <img src="img/back_button.svg" alt="Zurück" />
          </a>
          <h1 class="title-wrapper gen-profile-title">Profil<br>hinzufügen</h1>
        </header>

        <!-- Avatar -->
        <div class="gen-avatar-wrapper">
          <div class="gen-avatar-img-box" id="avatarBox">
            <img src="img/eddy.png" alt="Profilbild" id="avatarPreview" class="gen-avatar-img" />
            <button type="button" class="gen-avatar-edit-btn" onclick="document.getElementById('avatarInput').click()" aria-label="Profilbild ändern">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            </button>
            <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="previewAvatar(event)" />
          </div>
          <p class="gen-avatar-label">Profilbild ändern</p>
        </div>

        <!-- Formular -->
        <div class="gen-form-card">
          <div class="input-wrapper">
            <label for="childName">Name des Kindes</label>
            <input type="text" id="childName" placeholder="Name eingeben" autocomplete="off" />
          </div>
          <!-- <div class="input-wrapper">
            <label for="brushId">Zahnbürsten-Nummer</label>
            <div class="gen-input-icon-wrapper">
              <input type="text" id="brushId" placeholder="z.B. TB-12345" autocomplete="off" />
              <button type="button" class="gen-info-btn" aria-label="Info zur Zahnbürsten-Nummer" onclick="toggleInfo()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
              </button>
            </div>
            <p class="gen-info-text" id="infoText" style="display:none">Die Zahnbürsten-Nummer findest du auf der Verpackung deiner smarten Zahnbürste.</p>
          </div> -->
        </div>

        <!-- Submit -->
        <div class="button-wrapper">
          <button type="button" class="intro-button intro-button-primary gen-submit-btn" onclick="saveProfile()">
            Profil hinzufügen
          </button>
        </div>

      </section>
    </main>

    <script src="js/auth.js"></script>
    <script>
      function previewAvatar(e) {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById('avatarPreview').src = URL.createObjectURL(file);
      }

      function toggleInfo() {
        const el = document.getElementById('infoText');
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
      }

      function saveProfile() {
        const name = document.getElementById('childName').value.trim();
        const brushId = document.getElementById('brushId').value.trim();
        if (!name) { alert('Bitte einen Namen eingeben.'); return; }
        // Hier später: API-Call zum Speichern
        alert(`Profil "${name}" wurde hinzugefügt!`);
        window.location.href = 'choose-profile.html';
      }
    </script>
  </body>
</html>
