<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil hinzufügen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cousine:ital,wght@0,400;0,700;1,400;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .gen-alert {
        width: 100%;
        padding: 14px 18px;
        border-radius: var(--radius-large);
        font-size: 0.95rem;
        font-weight: 600;
        line-height: 1.4;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .gen-alert--error {
        background: rgba(255, 80, 80, 0.18);
        border: 1.5px solid rgba(255, 80, 80, 0.45);
        color: #fff;
      }
      .gen-alert--success {
        background: rgba(80, 220, 140, 0.18);
        border: 1.5px solid rgba(80, 220, 140, 0.45);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main class="page-wrapper">
      <section class="login-wrapper gen-profile-wrapper">

        <!-- Header -->
        <header class="gen-profile-header">
          <a href="choose-profile.html" class="circle-button" aria-label="Zurück">
            <img src="img/back_button.svg" alt="Zurück" />
          </a>
          <h1 class="title-wrapper gen-profile-title">Profil<br>hinzufügen</h1>
        </header>

        <!-- Feedback-Banner -->
        <div id="alertBox" class="gen-alert" style="display:none" role="alert" aria-live="polite"></div>

        <!-- Avatar -->
        <div class="gen-avatar-wrapper">
          <div class="gen-avatar-img-box" id="avatarBox">
            <img src="img/eddy.png" alt="Profilbild" id="avatarPreview" class="gen-avatar-img" />
            <button type="button" class="gen-avatar-edit-btn" onclick="document.getElementById('avatarInput').click()" aria-label="Profilbild ändern">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            </button>
            <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="previewAvatar(event)" />
          </div>
          <p class="gen-avatar-label">Profilbild ändern</p>
        </div>

        <!-- Formular — action zeigt auf PHP, name-Attribut überträgt den Wert -->
        <form
          id="profileForm"
          action="generate-profile.php"
          method="POST"
          class="gen-form-card"
          novalidate
        >
          <div class="input-wrapper">
            <label for="childName">Name des Kindes</label>
            <input
              type="text"
              id="childName"
              name="childName"
              placeholder="Name eingeben"
              autocomplete="off"
            />
          </div>
        </form>

        <!-- Submit -->
        <div class="button-wrapper">
          <button
            type="submit"
            form="profileForm"
            class="intro-button intro-button-primary gen-submit-btn"
            id="submitBtn"
          >
            Profil hinzufügen
          </button>
        </div>

      </section>
    </main>

    <script src="js/auth.js"></script>
    <script>
      // ── Avatar Vorschau ──
      function previewAvatar(e) {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById('avatarPreview').src = URL.createObjectURL(file);
      }

      // ── URL-Parameter auslesen (Fehler vom PHP) ──
      (function checkUrlParams() {
        const params = new URLSearchParams(window.location.search);
        const error  = params.get('error');

        if (error === 'name') {
          showAlert('error', '⚠️ Bitte gib einen Namen für das Kind ein.');
        } else if (error === 'db') {
          showAlert('error', '⚠️ Ein Fehler ist aufgetreten. Bitte versuche es nochmal.');
        }

        // URL sauber halten ohne Reload
        if (error) history.replaceState(null, '', window.location.pathname);
      })();

      // ── Client-seitige Validierung vor dem Absenden ──
      document.getElementById('profileForm').addEventListener('submit', function (e) {
        const name = document.getElementById('childName').value.trim();
        if (!name) {
          e.preventDefault();
          showAlert('error', '⚠️ Bitte gib einen Namen für das Kind ein.');
          document.getElementById('childName').focus();
          return;
        }
        // Doppelklick verhindern
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'Wird gespeichert…';
      });

      // ── Alert anzeigen ──
      function showAlert(type, message) {
        const box = document.getElementById('alertBox');
        box.className = 'gen-alert gen-alert--' + type;
        box.textContent = message;
        box.style.display = 'flex';
        box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    </script>
  </body>
</html>
