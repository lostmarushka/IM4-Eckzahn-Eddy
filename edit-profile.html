<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile bearbeiten</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cousine:ital,wght@0,400;0,700;1,400;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/edit-profile.css" />
  </head>

  <body>
    <main class="page-wrapper">
      <section class="login-wrapper edit-profile-wrapper">
        <header class="edit-profile-header">
          <a
            href="choose-profile.html"
            class="circle-button"
            aria-label="Zurück"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M19 12H5M12 5l-7 7 7 7" />
            </svg>
          </a>
          <h1 class="edit-profile-title">Profile<br />bearbeiten</h1>
        </header>

        <div
          id="editAlert"
          class="edit-alert"
          role="alert"
          aria-live="polite"
        ></div>

        <div id="profileListContainer">
          <div class="profile-list-skeleton" aria-hidden="true">
            <div class="skeleton-item"></div>
            <div class="skeleton-item"></div>
            <div class="skeleton-item"></div>
          </div>
        </div>
      </section>
    </main>

    <!-- Delete Confirm Modal -->
    <div
      id="delete-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="deleteModalTitle"
      aria-describedby="deleteModalText"
    >
      <div class="modal-box">
        <h2 class="modal-title" id="deleteModalTitle">Profil löschen?</h2>
        <p class="modal-text" id="deleteModalText">
          Möchtest du das Profil <strong id="deleteModalName"></strong> wirklich
          löschen? Alle Daten dieses Profils werden dauerhaft entfernt.
        </p>

        <div class="modal-buttons">
          <button class="modal-btn-primary" id="deleteConfirmBtn">
            Ja, löschen
          </button>
          <button class="modal-btn-secondary" id="deleteCancelBtn">
            Abbrechen
          </button>
        </div>
      </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/edit-profile.js"></script>
  </body>
</html>
