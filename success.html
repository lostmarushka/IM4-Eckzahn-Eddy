<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Putzen abgeschlossen</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Cousine:wght@400;700&family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <main class="page-wrapper page-wrapper-brushing success-page-wrapper">
      <section class="login-wrapper success-wrapper">
        <!-- Header -->
        <header class="success-header-wrapper">
          <h1 class="title-wrapper success-title">SUPER!</h1>

          <div class="success-stars-wrapper" aria-hidden="true">
            <img
              src="img/star_yellow.svg"
              alt=""
              class="success-star"
            />
            <img
              src="img/star_yellow.svg"
              alt=""
              class="success-star"
            />
            <img
              src="img/star_yellow.svg"
              alt=""
              class="success-star"
            />
          </div>
        </header>

        <!-- Character -->
        <section class="success-character-wrapper">
          <div class="intro-image-wrapper success-image-wrapper">
            <img
              src="img/eddy_success.png"
              alt="Eddy freut sich über das Zähneputzen"
              class="intro-image success-image"
              loading="lazy"
            />
          </div>
        </section>

        <!-- Success Card -->
        <section class="intro-card-wrapper success-card-wrapper">
          <div class="success-card-inner">
            <h2 class="intro-card-title success-card-title">
              Geschafft!
            </h2>

            <p class="intro-card-text success-card-text">
              Du hast 2 ganze Minuten geputzt!<br />
              Deine Zähne sind super sauber und<br />
              Eddy ist so stolz auf dich!
            </p>

            <!-- Rewards -->
            <div class="success-rewards-wrapper">
              <div class="success-badge success-badge-points">
                <span>+10 Punkte</span>
              </div>

              <div class="success-badge success-badge-star">
                <img
                  src="img/star_purple.svg"
                  alt=""
                  class="success-badge-icon"
                />
                <span>+1 Stern</span>
              </div>
            </div>
          </div>

          <!-- Decorative corners -->
          <div class="success-corner success-corner-top-left"></div>
          <div class="success-corner success-corner-top-right"></div>
          <div class="success-corner success-corner-bottom-left"></div>
          <div class="success-corner success-corner-bottom-right"></div>
        </section>

        <!-- Actions -->
        <div class="intro-actions-wrapper success-actions-wrapper">
          <div class="button-wrapper">
            <button
              type="button"
              class="intro-button intro-button-primary success-main-button"
              onclick="window.location.href='protected.html'"
            >
              Zurück zu Profilen
            </button>
          </div>

          <div class="button-wrapper">
            <button
              type="button"
              class="intro-button intro-button-secondary success-secondary-button"
              onclick="window.location.href='statistics.html'"
            >
              Meine Statistiken
            </button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
