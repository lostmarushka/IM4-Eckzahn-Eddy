<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Willkommen – Eckzahn Eddy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cousine:ital,wght@0,400;0,700;1,400;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="page-wrapper">
      <section class="login-wrapper">
        <div class="intro-header-wrapper">
          <div class="heading-wrapper intro-heading-wrapper">
            <img src="img/zahn.svg" alt="Zahn" class="zahn" />
            <h1 class="title-wrapper">ECKZAHN EDDY</h1>
            <img src="img/zahn.svg" alt="Zahn" class="zahn" />
          </div>

          <div class="intro-dots-wrapper" aria-hidden="true">
            <span class="intro-dot intro-dot-yellow"></span>
            <span class="intro-dot intro-dot-peach"></span>
            <span class="intro-dot intro-dot-pink"></span>
          </div>
        </div>

        <div class="intro-image-wrapper">
          <img
            src="img/eddy.png"
            alt="Illustration von Eddy dem Dinosaurier"
            class="intro-image"
          />
        </div>

        <section class="intro-card-wrapper">
          <h2 class="intro-card-title">Putzspass für Kinder!</h2>
          <p class="intro-card-text">
            Mach das Zähneputzen zum Abenteuer mit Eddy dem Dinosaurier.
            Verfolge deinen Fortschritt und sammle Belohnungen!
          </p>
          <p class="intro-card-text">
            Funktioniert mit unserer smarten Zahnbürste.
          </p>
        </section>

        <div class="intro-actions-wrapper">
          <div class="button-wrapper">
            <a href="register.html" class="intro-button intro-button-primary">
              Konto erstellen
            </a>
          </div>

          <div class="button-wrapper">
            <a href="login.html" class="intro-button intro-button-secondary">
              Anmelden
            </a>
          </div>
        </div>
      </section>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/logout.js"></script>
  </body>
</html>
