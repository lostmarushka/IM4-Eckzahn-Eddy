<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stats Übersicht – Eckzahn Eddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cousine:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="stats-overview">
  <div class="page-wrapper stats-page-wrapper">
    <div class="login-wrapper stats-wrapper">

      <header class="brushing-header-wrapper">
        <button class="circle-button circle-button-light" aria-label="Zurück" onclick="history.back()">
          <img src="img/back_button.svg" alt="Zurück" />
        </button>
        <div class="brushing-title-wrapper">
          <h1 class="title-wrapper">STATISTIK</h1>
          <p class="brushing-name js-username">–</p>
        </div>
        <a href="protected.html" class="circle-button-icon" aria-label="Profil">
          <img src="img/profile_button.svg" alt="" />
        </a>
      </header>

      <!-- Tabs -->
      <div class="stats-tabs-wrapper stats-tabs-wrapper--three" role="tablist">
        <button class="stats-tab stats-tab--active" role="tab" aria-selected="true"
          onclick="location.href='stats-overview.html'">Übersicht</button>
        <button class="stats-tab" role="tab" aria-selected="false"
          onclick="location.href='stats-daily.html'">Daily</button>
        <button class="stats-tab" role="tab" aria-selected="false"
          onclick="location.href='stats-weekly.html'">Weekly</button>
      </div>

     <!-- Putz-Score Card -->
<section class="stats-card" aria-label="Putz-Score">
  <div class="stats-card-title-row">
    <h2 class="stats-card-title">Putz-Score</h2>
    <img src="img/dot_yellow.svg" alt="" class="button-icon-image" style="width:24px;height:24px;" />
  </div>
  <div class="stats-score-display">
    <span class="stats-score-value js-score-value">–</span>
    <span class="stats-score-sub js-score-sub">von 100 Punkten</span>
  </div>
</section>

<!-- Diese Woche Card -->
<section class="stats-card" aria-label="Diese Woche">
  <div class="stats-card-title-row">
    <h2 class="stats-card-title">Diese Woche</h2>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-timer-accent)"
      stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>
    </svg>
  </div>
  <div class="stats-week-grid">
    <div class="stats-week-tile">
      <img src="img/zahn_white.svg" alt="" class="button-icon-image stats-week-tile-icon" />
      <span class="stats-week-tile-label">Gesamt</span>
      <span class="stats-metric-value js-week-total">0</span>
    </div>
    <div class="stats-week-tile">
      <img src="img/dot_yellow.svg" alt="" class="button-icon-image stats-week-tile-icon" />
      <span class="stats-week-tile-label">Sterne</span>
      <span class="stats-metric-value js-week-stars">0</span>
    </div>
  </div>
</section>

<!-- Letzte Aktivität Card -->
<section class="stats-card" aria-label="Letzte Aktivität">
  <h2 class="stats-card-title">Letzte Aktivität</h2>
  <ul class="stats-activity-list js-activity-list">
    <li class="stats-activity-empty">Noch keine Aktivitäten</li>
  </ul>
</section>

    </div>
  </div>

  <script src="js/stats-overview.js"></script>
</body>
</html>
