<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zähne putzen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cousine:ital,wght@0,400;0,700;1,400;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="page-wrapper page-wrapper-brushing">
      <section class="login-wrapper brushing-wrapper">
        <header class="brushing-header-wrapper">
          <button
            onclick="history.back()"
            class="back-button"
            aria-label="Zurück"
          >
            <img src="img/back_button.svg" alt="Zurück" />
          </button>
          <div class="brushing-title-wrapper">
            <h1 class="title-wrapper">ZÄHNE PUTZEN</h1>
            <p class="brushing-name" id="activeProfileName">–</p>
          </div>
          <a
            href="protected.html"
            class="circle-button-icon"
            aria-label="Profil"
          >
            <img src="img/profile_button.svg" alt="" />
          </a>
        </header>

        <div class="brushing-stage-wrapper">
          <!-- Timer -->
          <section class="timer-wrapper" aria-label="Timer">
            <div class="ring-timer">
              <svg class="ring-svg" viewBox="0 0 500 500">
                <circle class="ring-track" cx="250" cy="250" r="220" />
                <circle
                  class="ring-progress"
                  id="ring-progress"
                  cx="250"
                  cy="250"
                  r="220"
                />
              </svg>
              <div class="ring-center">
                <p class="ring-time" id="ring-time">2:00</p>
                <div class="intro-dots-wrapper" aria-hidden="true">
                  <img
                    src="img/coloured_rectangles.svg"
                    alt=""
                    class="intro-dots"
                  />
                </div>
              </div>
            </div>
          </section>

          <!-- Charakter -->
          <div class="brushing-character-wrapper">
            <div class="intro-image-wrapper brushing-image-wrapper">
              <img
                src="img/eddy.png"
                alt="Eddy beim Zähneputzen"
                class="intro-image brushing-image"
                loading="lazy"
              />
            </div>
            <section class="speech-bubble-wrapper">
              <p class="speech-bubble-text" id="speech-text">
                Bereit zum Putzen?
              </p>
            </section>
          </div>
        </div>

        <!-- Aktionsbuttons -->
        <div class="intro-actions-wrapper brushing-actions-wrapper">
          <div class="button-wrapper" id="btn-start-wrapper">
            <button
              type="button"
              class="intro-button intro-button-primary"
              onclick="startBrushing()"
            >
              <img src="img/zahn_white.svg" alt="" class="button-icon-image" />
              <span>Putzen starten</span>
            </button>

            <!-- NUR ZUM TESTEN – danach entfernen -->
            <button
              onclick="
                elapsed = 120;
                finish();
              "
              style="
                margin-top: 10px;
                padding: 8px 16px;
                background: red;
                color: white;
                border: none;
                border-radius: 8px;
                cursor: pointer;
              "
            >
              🧪 Finish testen
            </button>
          </div>

          <div style="display: none; justify-content: center" id="badge-row">
            <span class="sensor-badge waiting" id="sensor-badge">
              <span class="sensor-dot"></span>
              <span id="sensor-label">Warte auf Sensor…</span>
            </span>
          </div>

          <div
            class="button-wrapper"
            id="btn-cancel-wrapper"
            style="display: none"
          >
            <button
              type="button"
              class="intro-button intro-button-secondary"
              onclick="openModal()"
            >
              <img src="img/dot_yellow.svg" alt="" class="button-icon-image" />
              <span>Abbrechen</span>
            </button>
          </div>
        </div>
      </section>
    </main>

    <!-- Modal -->
    <div id="cancel-modal">
      <div class="modal-box">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <h2 class="modal-title">Putzen abbrechen?</h2>
        <p class="modal-text">
          Bist du sicher, dass du aufhören möchtest? Dein Fortschritt wird
          gespeichert, aber nicht als abgeschlossen markiert.
        </p>
        <div class="modal-buttons">
          <button class="modal-btn-primary" onclick="closeModal()">
            Weiter putzen
          </button>
          <button class="modal-btn-secondary" onclick="confirmCancel()">
            Ja, abbrechen
          </button>
        </div>
      </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/logout.js"></script>

    <script>
      // ── Profilname + ID laden ────────────────────────────────────
      let activeKinderId = null;

      (async function loadProfileName() {
        try {
          const res = await fetch("api/get-active-profile.php");
          const data = await res.json();
          if (data.name) {
            document.getElementById("activeProfileName").textContent =
              data.name;
          }
          if (data.id) {
            activeKinderId = data.id;
          }
        } catch (e) {
          console.warn("Profilname konnte nicht geladen werden:", e);
        }
      })();

      // ── DOM-Referenzen ───────────────────────────────────────────
      const speechText = document.getElementById("speech-text");
      const btnStartWrap = document.getElementById("btn-start-wrapper");
      const badgeRow = document.getElementById("badge-row");
      const sensorBadge = document.getElementById("sensor-badge");
      const sensorLabel = document.getElementById("sensor-label");
      const btnCancelWrap = document.getElementById("btn-cancel-wrapper");
      const ringProgress = document.getElementById("ring-progress");
      const ringTime = document.getElementById("ring-time");

      // ── Timer-Setup ──────────────────────────────────────────────
      const TOTAL = 120;
      const CIRC = 2 * Math.PI * 220;
      const INACTIVE_TIMEOUT = 6000;
      ringProgress.style.strokeDasharray = CIRC;
      ringProgress.style.strokeDashoffset = 0;

      let appState = "idle";
      let pollInterval = null;
      let timerInterval = null;
      let lastSensorId = null;
      let lastActiveTime = null;
      let elapsed = 0;

      // ── Ring-Anzeige ─────────────────────────────────────────────
      function updateRing() {
        const remaining = TOTAL - elapsed;
        const mins = Math.floor(remaining / 60);
        const secs = remaining % 60;
        ringTime.textContent = `${mins}:${secs.toString().padStart(2, "0")}`;
        ringProgress.style.strokeDashoffset = CIRC * (elapsed / TOTAL);
        if (remaining <= 0) finish();
      }

      // ── Event speichern ──────────────────────────────────────────
      async function saveEvent(eventType) {
        try {
          const res = await fetch("api/save-event.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              kinder_id: activeKinderId,
              event: eventType,
              dauer: elapsed,
            }),
          });
          const text = await res.text();
          console.log("saveEvent Response:", res.status, text); // ← DEBUG
          console.log("Gesendete Daten:", {
            kinder_id: activeKinderId,
            event: eventType,
            dauer: elapsed,
          }); // ← DEBUG
        } catch (e) {
          console.warn("Event konnte nicht gespeichert werden:", e);
        }
      }

      // ── Sensor Polling ───────────────────────────────────────────
      async function pollSensor() {
        try {
          const res = await fetch("api/sensor-status.php", {
            cache: "no-store",
          });
          if (!res.ok) {
            checkInactive();
            return;
          }
          const data = await res.json();
          if (data.id !== null && data.id !== lastSensorId) {
            lastSensorId = data.id;
            onSensorActive();
          } else {
            checkInactive();
          }
        } catch {
          checkInactive();
        }
      }

      function checkInactive() {
        if (lastActiveTime && Date.now() - lastActiveTime > INACTIVE_TIMEOUT) {
          onSensorInactive();
        }
      }

      function onSensorActive() {
        lastActiveTime = Date.now();
        if (appState === "waiting") startTimer();
        else if (appState === "paused") resumeTimer();
      }

      function onSensorInactive() {
        if (appState === "running") pauseTimer();
      }

      // ── App-Zustände ─────────────────────────────────────────────
      async function startBrushing() {
        appState = "waiting";
        lastActiveTime = null;
        btnStartWrap.style.display = "none";
        badgeRow.style.display = "flex";
        btnCancelWrap.style.display = "grid";
        setBadge("waiting", "Warte auf Sensor…");
        speechText.textContent = "Los geht's!";

        // Aktuelle ID als Baseline – nur neuere gelten als aktiv
        try {
          const res = await fetch("api/sensor-status.php", {
            cache: "no-store",
          });
          const data = await res.json();
          lastSensorId = data.id;
        } catch {
          lastSensorId = null;
        }

        pollInterval = setInterval(pollSensor, 800);
      }

      function startTimer() {
        appState = "running";
        setBadge("active", "Sensor aktiv");
        speechText.textContent = "Weiter so! 💪";
        timerInterval = setInterval(() => {
          elapsed++;
          updateRing();
        }, 1000);
      }

      function pauseTimer() {
        appState = "paused";
        clearInterval(timerInterval);
        timerInterval = null;
        setBadge("paused", "Unterbrochen…");
        speechText.textContent = "Weitermachen!";
      }

      function resumeTimer() {
        appState = "running";
        setBadge("active", "Sensor aktiv");
        speechText.textContent = "Weiter so! 💪";
        timerInterval = setInterval(() => {
          elapsed++;
          updateRing();
        }, 1000);
      }

      async function cancelBrushing() {
        await saveEvent("abgebrochen");
        appState = "idle";
        clearInterval(pollInterval);
        clearInterval(timerInterval);
        pollInterval = null;
        timerInterval = null;
        elapsed = 0;
        lastSensorId = null;
        lastActiveTime = null;
        updateRing();
        btnStartWrap.style.display = "grid";
        badgeRow.style.display = "none";
        btnCancelWrap.style.display = "none";
        setBadge("waiting", "Warte auf Sensor…");
        speechText.textContent = "Bereit zum Putzen?";
      }

      async function finish() {
        await saveEvent("abgeschlossen");
        clearInterval(pollInterval);
        clearInterval(timerInterval);
        window.location.href = "success.html?kid=" + activeKinderId;
      }

      function setBadge(type, label) {
        sensorBadge.className = "sensor-badge " + type;
        sensorLabel.textContent = label;
      }

      // ── Modal ────────────────────────────────────────────────────
      function openModal() {
        document.getElementById("cancel-modal").style.display = "flex";
      }
      function closeModal() {
        document.getElementById("cancel-modal").style.display = "none";
      }
      function confirmCancel() {
        closeModal();
        cancelBrushing();
      }
      document
        .getElementById("cancel-modal")
        .addEventListener("click", function (e) {
          if (e.target === this) closeModal();
        });
    </script>
