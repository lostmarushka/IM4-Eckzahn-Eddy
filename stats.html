<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stats – Eckzahn Eddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cousine:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/stats.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="page-wrapper stats-page-wrapper">
    <div class="login-wrapper stats-wrapper">

      <header class="brushing-header-wrapper">
        <button class="circle-button circle-button-light" aria-label="Zurück" onclick="history.back()">
          <img src="img/back_button.svg" alt="Zurück" />
        </button>
        <div class="brushing-title-wrapper">
          <h1 class="title-wrapper">STATISTIK</h1>
          <p class="brushing-name js-username">–</p>
        </div>
        <a href="protected.html" class="circle-button-icon" aria-label="Profil">
          <img src="img/profile_button.svg" alt="" />
        </a>
      </header>

      <!-- Tabs -->
      <div class="stats-tabs-wrapper" role="tablist">
        <button class="stats-tab stats-tab--active js-tab-daily" role="tab" aria-selected="true">Daily</button>
        <button class="stats-tab js-tab-weekly" role="tab" aria-selected="false">Weekly</button>
      </div>

      <!-- Overview Card -->
      <section class="stats-card" aria-label="Übersicht">
        <h2 class="stats-card-title js-overview-title">Today's Overview</h2>
        <div class="stats-overview-grid">

          <div class="stats-metric-cell">
            <div class="stats-metric-icon stats-metric-icon--pink" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/>
              </svg>
            </div>
            <span class="stats-metric-value js-stat-sessions">–</span>
            <span class="stats-metric-label">Sessions</span>
          </div>

          <div class="stats-metric-divider" aria-hidden="true"></div>

          <div class="stats-metric-cell">
            <div class="stats-metric-icon stats-metric-icon--yellow" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17 5.8 21.3l2.4-7.4L2 9.4h7.6z"/>
              </svg>
            </div>
            <span class="stats-metric-value js-stat-completed">–</span>
            <span class="stats-metric-label">Completed</span>
          </div>

          <div class="stats-metric-divider" aria-hidden="true"></div>

          <div class="stats-metric-cell">
            <div class="stats-metric-icon stats-metric-icon--teal" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="10" rx="2"/><line x1="6.5" y1="13" x2="6.5" y2="21"/>
              </svg>
            </div>
            <span class="stats-metric-value js-stat-minutes">–</span>
            <span class="stats-metric-label">Minutes</span>
          </div>

        </div>
      </section>

      <!-- Chart Card -->
      <section class="stats-card" aria-label="Brushing Times">
        <h2 class="stats-card-title js-chart-title">Brushing Times Today</h2>
        <div class="stats-chart-wrapper">
          <canvas class="js-chart-canvas" aria-label="Brushing Times Chart" role="img"></canvas>
        </div>
      </section>

      <!-- Goal Card -->
      <section class="stats-card stats-goal-card" aria-label="Goal">
        <div class="stats-goal-content">
          <h2 class="stats-card-title js-goal-title">Daily Goal</h2>
          <p class="stats-goal-text js-goal-text">–</p>
        </div>
        <label class="stats-goal-checkbox-wrapper" aria-label="Ziel erreicht">
          <input type="checkbox" class="stats-goal-checkbox js-goal-checkbox" aria-checked="false" />
          <span class="stats-goal-checkmark" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </span>
        </label>
      </section>

    </div>
  </div>

  <script>
    window.CURRENT_USER = { id: 'USER_ID_HIER', name: 'USERNAME_HIER' };

    window.STATS_DATA = {
      daily: {
        sessions: 1, completed: 0, minutes: 0,
        goalCompleted: false, goalText: 'Brush twice a day',
        brushingEvents: [{ hour: 12, duration: 0.6 }]
      },
      weekly: {
        sessions: 5, completed: 3, minutes: 9,
        goalCompleted: true, goalText: 'Brush twice a day',
        brushingEvents: [
          { day: 0, duration: 0.3 }, { day: 1, duration: 0.9 },
          { day: 2, duration: 0.6 }, { day: 4, duration: 0.4 },
          { day: 6, duration: 0.3 }
        ]
      }
    };

    const elUsername   = document.querySelector('.js-username');
    const elSessions   = document.querySelector('.js-stat-sessions');
    const elCompleted  = document.querySelector('.js-stat-completed');
    const elMinutes    = document.querySelector('.js-stat-minutes');
    const elGoalCb     = document.querySelector('.js-goal-checkbox');
    const elGoalText   = document.querySelector('.js-goal-text');
    const elChartTitle = document.querySelector('.js-chart-title');
    const elOverTitle  = document.querySelector('.js-overview-title');
    const elGoalTitle  = document.querySelector('.js-goal-title');
    const tabDaily     = document.querySelector('.js-tab-daily');
    const tabWeekly    = document.querySelector('.js-tab-weekly');
    const chartCanvas  = document.querySelector('.js-chart-canvas');

    const HOURS = ['6 AM','7 AM','8 AM','9 AM','10 AM','11 AM','12 PM','1 PM','2 PM','3 PM','4 PM','5 PM','6 PM','7 PM','8 PM','9 PM'];
    const DAYS  = ['Mo','Di','Mi','Do','Fr','Sa','So'];
    const HOUR_START = 6;

    function buildChartData(events, isDaily) {
      if (isDaily) {
        const data = new Array(HOURS.length).fill(0);
        events.forEach(({ hour, duration }) => {
          const idx = hour - HOUR_START;
          if (idx >= 0 && idx < data.length) data[idx] = Math.min(Math.max(Math.round(duration * 3), 1), 3);
        });
        return data;
      } else {
        const data = new Array(DAYS.length).fill(0);
        events.forEach(({ day, duration }) => {
          if (day >= 0 && day < data.length) data[day] = Math.min(Math.max(Math.round(duration * 3), 1), 3);
        });
        return data;
      }
    }

    let chart = null;

    function initChart(events, isDaily) {
      chart = new Chart(chartCanvas.getContext('2d'), {
        type: 'line',
        data: {
          labels: isDaily ? HOURS : DAYS,
          datasets: [{
            data: buildChartData(events, isDaily),
            borderColor: '#9fe3b0',
            backgroundColor: 'rgba(159,227,176,0.12)',
            pointBackgroundColor: '#9fe3b0',
            pointBorderColor: '#9fe3b0',
            pointRadius: 5, pointHoverRadius: 7,
            fill: true, tension: 0.3, borderWidth: 2,
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: { label: ctx => ` ${(ctx.raw * 60).toFixed(0)} Sek.` },
              backgroundColor: 'rgba(78,31,148,0.9)',
              titleColor: '#fff', bodyColor: '#9fe3b0',
              padding: 10, cornerRadius: 10,
            }
          },
          scales: {
            x: {
              ticks: { color: 'rgba(255,255,255,0.65)', font: { size: 11, family: 'Inter' }, maxRotation: 0 },
              grid: { color: 'rgba(255,255,255,0.07)' }, border: { color: 'transparent' }
            },
            y: {
              min: 0, max: 3,
              ticks: { color: 'rgba(255,255,255,0.65)', font: { size: 11, family: 'Inter' }, stepSize: 1, callback: val => Number.isInteger(val) ? val : '' },
              grid: { color: 'rgba(255,255,255,0.07)' }, border: { color: 'transparent' }
            }
          }
        }
      });
    }

    function renderStats(data, isDaily) {
      elSessions.textContent  = data.sessions;
      elCompleted.textContent = data.completed;
      elMinutes.textContent   = data.minutes;
      elGoalCb.checked        = data.goalCompleted;
      elGoalCb.setAttribute('aria-checked', data.goalCompleted);
      elGoalText.textContent  = data.goalText;
      elChartTitle.textContent = isDaily ? 'Brushing Times Today' : 'Brushing Times This Week';
      elOverTitle.textContent  = isDaily ? "Today's Overview"    : "This Week's Overview";
      elGoalTitle.textContent  = isDaily ? 'Daily Goal'          : 'Weekly Goal';
      if (chart) {
        chart.data.labels           = isDaily ? HOURS : DAYS;
        chart.data.datasets[0].data = buildChartData(data.brushingEvents, isDaily);
        chart.update();
      }
    }

    function switchTab(isDaily) {
      tabDaily.classList.toggle('stats-tab--active', isDaily);
      tabWeekly.classList.toggle('stats-tab--active', !isDaily);
      tabDaily.setAttribute('aria-selected', isDaily);
      tabWeekly.setAttribute('aria-selected', !isDaily);
      renderStats(isDaily ? STATS_DATA.daily : STATS_DATA.weekly, isDaily);
    }

    tabDaily.addEventListener('click',  () => switchTab(true));
    tabWeekly.addEventListener('click', () => switchTab(false));

    elUsername.textContent = CURRENT_USER.name;
    renderStats(STATS_DATA.daily, true);
    window.addEventListener('load', () => initChart(STATS_DATA.daily.brushingEvents, true));
  </script>
</body>
</html>
