<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil wählen</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cousine:ital,wght@0,400;0,700;1,400;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="page-wrapper">
      <section class="login-wrapper choose-profile-wrapper">

        <!-- Deko-Punkte oben -->
        <div class="intro-dots-wrapper" aria-hidden="true">
          <img src="img/coloured_dots.svg" alt="" class="intro-dots" />
        </div>

        <!-- Titel -->
        <header class="choose-profile-header">
          <h1 class="title-wrapper">Profil<br>wählen</h1>
          <p class="choose-profile-subtitle">Wer putzt heute?</p>
        </header>

        <!-- Profilgitter: 4 Kolonnen Desktop → 3 → 2 Mobile -->
        <div class="profile-grid" role="list">

          <!-- Profil: Emma | data-kinder-id = ID aus kinder-Tabelle -->
          <button
            class="profile-card"
            role="listitem"
            data-name="Emma"
            data-kinder-id="1"
            onclick="selectProfile(this)"
            aria-label="Profil Emma wählen"
          >
            <div class="profile-avatar profile-avatar--pink">
              <img src="img/profile_emma.jpg" alt="Emma" loading="lazy" />
            </div>
            <span class="profile-name">Emma</span>
          </button>

          <!-- Profil: Max -->
          <button
            class="profile-card"
            role="listitem"
            data-name="Max"
            data-kinder-id="2"
            onclick="selectProfile(this)"
            aria-label="Profil Max wählen"
          >
            <div class="profile-avatar profile-avatar--yellow">
              <img src="img/profile_max.jpg" alt="Max" loading="lazy" />
            </div>
            <span class="profile-name">Max</span>
          </button>

          <!-- Profil: Sophie -->
          <button
            class="profile-card"
            role="listitem"
            data-name="Sophie"
            data-kinder-id="3"
            onclick="selectProfile(this)"
            aria-label="Profil Sophie wählen"
          >
            <div class="profile-avatar profile-avatar--teal">
              <img src="img/profile_sophie.jpg" alt="Sophie" loading="lazy" />
            </div>
            <span class="profile-name">Sophie</span>
          </button>

          <!-- Profil hinzufügen (noch nicht aktiv) -->
          <div
            class="profile-card profile-card--add"
            role="listitem"
            aria-label="Profil hinzufügen (noch nicht verfügbar)"
          >
            <div class="profile-avatar profile-avatar--add">
              <img src="img/hinzufuegen.svg" alt="" aria-hidden="true" />
            </div>
            <span class="profile-name">Profil<br>hinzufügen</span>
          </div>

        </div>

        <!-- Aktionsbuttons -->
        <div class="choose-profile-actions">
          <a href="protected.html" class="intro-button intro-button-secondary">
            <span>⚙ Profile verwalten</span>
          </a>
          <a href="api/logout.php" class="intro-button intro-button-secondary">
            <span>→ Abmelden</span>
          </a>
        </div>

      </section>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/choose-profile.js"></script>
    <script>
      async function loadProfiles() {
        const grid = document.getElementById('profileGrid');

        try {
          const res  = await fetch('api/get-profiles.php');
          const data = await res.json();

          // Grid leeren (Lade-Platzhalter entfernen)
          grid.innerHTML = '';

          if (data.status === 'success') {
            data.kinder.forEach(kind => {
              const btn = document.createElement('button');
              btn.className = 'profile-card';
              btn.setAttribute('role', 'listitem');
              btn.setAttribute('data-name', kind.name);
              btn.setAttribute('data-kinder-id', kind.id);
              btn.setAttribute('aria-label', 'Profil ' + kind.name + ' wählen');
              btn.addEventListener('click', () => selectProfile(btn));

              // Avatar: Bild wenn vorhanden, sonst Initiale
              const avatarHTML = kind.avatar
                ? `<img src="/${kind.avatar}" alt="${kind.name}" loading="lazy" />`
                : `<span class="profile-initial">${kind.name.charAt(0).toUpperCase()}</span>`;

              btn.innerHTML = `
                <div class="profile-avatar">${avatarHTML}</div>
                <span class="profile-name">${kind.name}</span>
              `;
              grid.appendChild(btn);
            });
          }

          // "Profil hinzufügen"-Button immer am Ende
          const addLink = document.createElement('a');
          addLink.href = 'generate-profile.html';
          addLink.className = 'profile-card';
          addLink.setAttribute('role', 'listitem');
          addLink.setAttribute('aria-label', 'Profil hinzufügen');
          addLink.innerHTML = `
            <div class="profile-avatar profile-avatar--add">
              <img src="img/hinzufuegen.svg" alt="" aria-hidden="true" />
            </div>
            <span class="profile-name">Profil<br>hinzufügen</span>
          `;
          grid.appendChild(addLink);

        } catch (e) {
          console.error('Profile laden fehlgeschlagen:', e);
          grid.innerHTML = '<p style="color:var(--color-error,red);padding:1rem;">Profile konnten nicht geladen werden.</p>';
        }
      }

      loadProfiles();
    </script>
  </body>
</html>
